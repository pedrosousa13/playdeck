packages:
  - packages/*
  - apps/*
  - tests/bundle/*
  - tests/integrations/*
# Advisories in transitive development dependencies, none of which reach a
# published package: `brace-expansion` arrives under eslint's minimatch,
# `postcss`/`sharp` under the Next.js build in tests/integrations, and
# `nanoid` under vite's postcss in the dev toolchain. They are
# pinned forward here rather than left for `pnpm audit` to keep reporting --
# the alternative is re-triaging the same five findings on every run.
# The two floors SIDEPRO-221 raised name the advisory behind them, so a later
# reader can tell when an entry has outlived its reason. `sharp` predates that
# and carries no such record:
#   brace-expansion >=5.0.9  GHSA-rgw5-rvv9-x895 (high, DoS)
#   postcss         >=8.5.23 GHSA-fxqj-rqcc-2cmp (moderate, sourceMappingURL)
#   nanoid          >=3.3.17 GHSA-2v37-7h3g-55p8 (high, infinite loop on zero size)
#   js-yaml         >=3.15.1 GHSA-5p4m-2wfm-xmqj (high, quadratic CPU in !!omap)
#   js-yaml         >=4.3.1  GHSA-5p4m-2wfm-xmqj (same advisory, 4.x range)
# js-yaml needs one entry per major: the advisory covers 3.x and 4.x with
# separate patched versions, and a single `<4.3.1` selector would drag 3.x
# across a major boundary. It reaches us only under @changesets/cli.
# `nanoid` carries a ceiling for the same reason: unbounded, it resolves to
# 6.x, which is ESM-only and requires Node >=22 -- below our 20.19 floor.
overrides:
  brace-expansion@<5.0.9: '>=5.0.9'
  postcss@<8.5.23: '>=8.5.23'
  sharp@<0.35.0: '>=0.35.0'
  nanoid@<3.3.17: '>=3.3.17 <4'
  js-yaml@3: '>=3.15.1 <4'
  js-yaml@4: '>=4.3.1 <5'
allowBuilds:
  esbuild@0.28.1: true
minimumReleaseAgeExclude:
  - '@vitejs/plugin-react@6.0.4'
  - react-dom@19.2.8
  - react@19.2.8
  - '@publint/pack@0.1.6'
  - publint@0.3.22
