packages:
  - packages/*
  - apps/*
  - tests/bundle/*
  - tests/integrations/*
  # Private test support, shared between packages. Private, so it never
  # enters the publishable set (#314).
  - tests/support
  # The library-comparison fixture (#543): pinned devDependencies on the
  # compared libraries, bundled by scripts/compare-libraries.mjs. Private for
  # the same reason tests/support is.
  - tests/compare
# Advisories pinned forward here rather than left for `pnpm audit` to keep
# reporting -- the alternative is re-triaging the same findings on every run.
# Every floor names the advisory behind it, so a later reader can tell when an
# entry has outlived its reason. Seven entries cover the advisories below;
# js-yaml takes one entry per major for the reason given below, undici takes
# one entry for the 7.x line only (see the note under the overrides block),
# and a floor that answers more than one GHSA id lists all of them:
#   brace-expansion >=5.0.12 GHSA-rgw5-rvv9-x895, GHSA-q2hr-2g5m-vwhr (high, DoS)
#   postcss         >=8.5.23 GHSA-fxqj-rqcc-2cmp (moderate, sourceMappingURL)
#   sharp           >=0.35.4 GHSA-f88m-g3jw-g9cj, GHSA-rgj7-g3m4-5g8c
#                            (high, libvips/libheif CVEs)
#   nanoid          >=3.3.17 GHSA-2v37-7h3g-55p8 (high, infinite loop on zero size)
#   js-yaml         >=3.15.2 GHSA-5p4m-2wfm-xmqj, GHSA-2883-xcg3-v3hh
#                            (high, quadratic CPU)
#   js-yaml         >=4.3.2  GHSA-5p4m-2wfm-xmqj, GHSA-2883-xcg3-v3hh
#                            (same advisories, 4.x range)
#   undici@7        >=7.29.1 GHSA-pmjh-fq2x-6v4x, GHSA-r53p-7pc4-xj5r,
#                            GHSA-2jfj-6hjv-fm6j, GHSA-2gqq-gqf2-x968,
#                            GHSA-w293-vg96-wgc3, GHSA-8436-99hf-9mmv (high;
#                            six advisories fixed by 7.29.1 -- TLS bypass,
#                            cookie disclosure, DoS, response splitting, method
#                            replay, response truncation)
# None of these reaches a publishable package as the graph resolves today.
# Publishable means the manifest does not set `private`, and nothing else --
# scripts/workspace-packages.mjs holds that definition, and it is not the
# directory a package sits in: tests/integrations/next-image declares `next`
# under `dependencies`, and `postcss`, `sharp` and `nanoid` all arrive through
# it, but it is private and ships nowhere. `postcss` also arrives under `vite`
# and under Storybook's webpack, `brace-expansion` under eslint's minimatch and
# Storybook's glob, `nanoid` only under `postcss` and so everywhere `postcss`
# reaches, and `js-yaml` only under @changesets/cli.
# That paragraph is a reading of the graph at one moment, not a standing
# property of this repo. It was false from #170, when @playdeck/provider-wistia
# arrived carrying `@wistia/wistia-player` in its `dependencies` -- which
# dragged webpack, and so `postcss`, into a package that would have shipped --
# until #266 dropped the vendor package for a CDN load. A floor in this file
# cannot travel to a consumer, so anything published in that window would have
# carried the advisory with no way for a consumer to patch it, and this block
# said none.
# `scripts/audit.mjs` recomputes the reachability on every CI run, from each
# publishable package's own `dependencies`, and fails on any advisory it can
# reach at any severity; `pnpm test:audit` is what answers the question.
# `sharp` carried no advisory identifier until the one above was added here.
# The floor came in with #107, which recorded a count of findings and no
# identifier, so what it was raised for is not recoverable. It was established
# by removal instead: without the floor `sharp` resolves to 0.34.5 and
# `pnpm test:audit` reports GHSA-f88m-g3jw-g9cj, so the floor stays with that
# named -- the reason it has now, not necessarily the one it was raised for.
# GHSA-rgj7-g3m4-5g8c, opened against sharp <0.35.4, raised the floor from
# >=0.35.0 to >=0.35.4 without changing why it exists.
# js-yaml needs one entry per major: the advisory covers 3.x and 4.x with
# separate patched versions, and a single `<4.3.1` selector would drag 3.x
# across a major boundary.
# `nanoid` carries a ceiling for the same reason: unbounded, it resolves to
# 6.x, which is ESM-only and requires Node >=22 -- below our 20.19 floor.
# `undici@7` is a patch over `wrangler`'s `miniflare`, which pins undici to
# an exact 7.29.0 rather than a range -- the advisories it fixes are reached
# through the `wrangler` devDependency, the one dependency in this file that
# runs with the Cloudflare API token, so bumping `wrangler` itself ahead of
# the 24-hour `minimumReleaseAge` hold to pick up a newer `miniflare` is what
# that hold exists to prevent. This override is temporary: once a `wrangler`
# release old enough to clear the hold ships a `miniflare` pinning undici
# >=7.29.1 on its own, this entry stops being reached and can go -- the
# weekly Dependabot run against this file will propose exactly that.
overrides:
  brace-expansion@<5.0.12: '>=5.0.12'
  postcss@<8.5.23: '>=8.5.23'
  sharp@<0.35.4: '>=0.35.4'
  nanoid@<3.3.17: '>=3.3.17 <4'
  js-yaml@3: '>=3.15.2 <4'
  js-yaml@4: '>=4.3.2 <5'
  undici@7: '>=7.29.1 <8'
allowBuilds:
  esbuild@0.28.1: true
# A 24-hour hold, in minutes, before a newly published version is eligible to
# resolve. It covers the window an audit gate cannot: a maintainer-compromise
# release carries no advisory yet, so `pnpm audit` has nothing to report and
# only time separates us from it. The two controls are complements.
# A frozen-lockfile install replays resolutions that already happened and is
# unaffected, so the cost falls on dependency-update work rather than on CI.
# The entries below are exempt from the hold. Unlike the override floors
# above, they name no reason: all five arrived with the workspace bootstrap
# (#20), before any cooldown existed to be excluded from, so there is no
# record of why each was chosen and no way to tell when one has outlived its
# reason. They are kept as they are here -- re-triaging them is its own
# decision. A new entry should name the version it unblocks and why.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@vitejs/plugin-react@6.0.4'
  - react-dom@19.2.8
  - react@19.2.8
  - '@publint/pack@0.1.6'
  - publint@0.3.22
