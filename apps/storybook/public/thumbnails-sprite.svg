<svg xmlns="http://www.w3.org/2000/svg" width="800" height="90" viewBox="0 0 800 90" role="img" aria-hidden="true">
  <!-- A fixture sprite for the `thumbnail` part (see thumbnails.vtt beside
       this file): five 160x90 tiles in a horizontal strip, each a single
       flat, maximally distinct colour rather than a photographic frame.
       Deterministic, needs no build step, and lets a test tell tiles apart
       by sampling one pixel. Tile order left to right is tile 0 to 4.

       No adjacent hyphens anywhere in this comment, including this
       sentence: an XML comment may not contain two hyphens in a row. A
       violating file still parses fine inline but silently fails to decode
       as an image (measured: naturalWidth and naturalHeight both read 0
       loaded through an img element, despite complete reading true), which
       is what actually renders the thumbnail part. -->
  <rect x="0" y="0" width="160" height="90" fill="#ff0000" />
  <rect x="160" y="0" width="160" height="90" fill="#00ff00" />
  <rect x="320" y="0" width="160" height="90" fill="#0000ff" />
  <rect x="480" y="0" width="160" height="90" fill="#ffff00" />
  <rect x="640" y="0" width="160" height="90" fill="#ff00ff" />
</svg>
