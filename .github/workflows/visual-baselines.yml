name: Visual baselines

# The five PNG baselines in `e2e/__screenshots__` are compared on
# `ubuntu-latest` and can only be generated there: macOS and Linux render text
# differently, and there is no docker on the maintainer's machine to bridge the
# gap. So regenerating them is a workflow, not a local command — an
# un-refreshable baseline is the check somebody deletes at the first font bump.
#
# Run it, download the artifact, commit the PNGs:
#
#   gh workflow run visual-baselines.yml --ref "$(git branch --show-current)"
#   gh run download <run-id> --name visual-baselines --dir e2e/__screenshots__
#   git add e2e/__screenshots__ && git commit
#
# `--ref <branch>` runs the branch's copy of this file, but GitHub only offers
# `workflow_dispatch` for workflows that exist on the DEFAULT branch — so this
# is undispatchable until it has merged once (HTTP 404: "workflow
# visual-baselines.yml not found on the default branch"). Before then, take the
# images from the `visual-diff` artifact of a failing `visual` CI job: Playwright
# writes each missing baseline as `<name>-actual.png` next to the failure.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # `test:e2e`'s Playwright config builds `apps/site` to serve the
      # `site-*` specs (`playwright.config.ts`'s second `webServer`), so this
      # job needs the same `ffmpeg` check and media cache the `site` job has.
      - uses: ./.github/actions/sprite-fright-media
      # `--update-snapshots` writes missing and changed baselines and reports
      # the run as failed when it changed anything, which is correct but not
      # useful here: the artifact is the deliverable either way.
      - run: pnpm test:e2e --project=visual --update-snapshots --reporter=list,json
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: playwright-report.json
      # `continue-on-error` above also swallowed the defect that shipped here:
      # without the `sprite-fright-media` step, `apps/site`'s build broke, so
      # Playwright's webServer never started and no test ran at all -- yet the
      # step still went green and the upload below still ran (run 35919816879:
      # "Process from config.webServer was not able to start. Exit code: 1",
      # job conclusion success). On that path the run aborts before the
      # reporter's `onBegin` ever fires, so the JSON reporter has no suite to
      # serialize and writes nothing rather than an empty report -- a missing
      # file is as much a red signal here as a zero count inside one.
      - name: Confirm the visual project actually ran
        run: |
          if [ ! -s playwright-report.json ]; then
            echo "::error::No Playwright JSON report was written -- the run above aborted before any test started."
            exit 1
          fi
          node -e '
            const { stats } = JSON.parse(require("fs").readFileSync("playwright-report.json", "utf8"));
            const ran = (stats.expected ?? 0) + (stats.unexpected ?? 0) + (stats.flaky ?? 0);
            if (ran === 0) {
              console.error("Playwright reported zero completed tests:", stats);
              process.exit(1);
            }
            console.log(ran + " visual test(s) ran.");
          '
      - uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: e2e/__screenshots__/
          retention-days: 14
