name: Release

# Publishing is a deliberate act, so this is `workflow_dispatch` and nothing
# else. #229's brief asked for a push trigger on the default branch, but that
# was written for a changesets version-PR flow -- push, and the workflow decides
# for you whether the tree is a release. The repo is not using that flow for the
# bootstrap: the 0.1.0 bump landed by hand in #341, so a push trigger would put
# every merge to `main` in front of the publish step to make that call alone.
#
# `dry_run` defaults to true, so an accidental dispatch cannot publish. Flip it
# off only when the run is meant to claim the versions for real: npm has no
# unpublish for a version more than 72 hours old, and none of the seven names
# exists on the registry yet.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Resolve, pack and check the packages without publishing them
        type: boolean
        default: true

# Read-only, as in `ci.yml`. The release job below widens its own copy; nothing
# here is a reason to widen that one.
permissions:
  contents: read

# Deliberately not `cancel-in-progress`, unlike `ci.yml`: half the workspace on
# the registry and half of it not is worse than a queued second run.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # `pnpm test:packages` runs `scripts/verify-packaging.mjs`, whose `runFixture`
  # copies the fixture to an OS temp directory, installs the packed tarballs
  # into it and then executes what it resolved by building it. Because the
  # fixture leaves the repository, the root `pnpm-workspace.yaml` no longer
  # applies to it, and until #336 that made this the one install in the pipeline
  # governed by no lockfile, no release cooldown and no advisory floor.
  #
  # It is governed now. `writeFixtureWorkspace` writes the root workspace file
  # itself into the temp directory -- floors, `minimumReleaseAge`, its
  # exclusions and all, minus the member globs -- rather than a file carrying
  # only the tarball overrides. The install stays `--no-frozen-lockfile`,
  # because the `@playdeck/*` specs are per-run `file:` temp paths no committed
  # lockfile can satisfy; `reresolvedPackages` in
  # `scripts/packaging-fixture.mjs` is where that is stated in full, and is what
  # fails the run if anything else stopped replaying
  # `tests/packaging/fixture/pnpm-lock.yaml`.
  #
  # Anchored on those symbol names rather than on line numbers deliberately:
  # this comment cited five line numbers into that script and every one of them
  # had rotted before #336 closed.
  #
  # What still resolves fresh, stated rather than glossed: the packed tarballs'
  # own registry dependencies. `hls.js` and `@vimeo/player` are exact-pinned in
  # the packages' manifests, but their transitive closure is not, and no
  # lockfile generated without the tarballs can carry it. Those resolutions are
  # under the cooldown and the floors now, which is what `minimumReleaseAge`
  # exists for, but they are not pinned.
  #
  # That residue is why this stays a deliberate job of its own, and NOT a step
  # in `release` below: in the same job it would run on the same runner and the
  # same filesystem as `pnpm publish -r`, minutes before the tarballs are
  # packed, and a compromise inside the 24-hour window would be able to tamper
  # with what gets published under a provenance attestation that would vouch for
  # the result.
  #
  # The cost of the split: `release` builds its own tarballs, so this job proves
  # the packaging of an equivalent build rather than of the exact bytes that
  # ship. That is a real weakening of the comment below about the attestation
  # covering artifacts this run verified, and it is accepted because the
  # alternative is running the remaining resolution next to the publish.
  package-verify:
    if: github.repository == 'pedrosousa13/playdeck'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `verify-packaging.mjs` drives a real browser for its smoke test.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:packages

  release:
    # A fork gets its own copy of this file, its own Actions tab and its own
    # dispatch button. Under trusted publishing a fork cannot succeed anyway --
    # the OIDC claim carries the repository, and npm matches it against the
    # publisher configured for each package -- but it would still build and pack
    # under this repo's package names, so refuse outright instead of relying on
    # the registry to say no.
    if: github.repository == 'pedrosousa13/playdeck'
    needs: package-verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Provenance is not optional-with-a-warning. Without this permission npm
      # throws `Provenance generation in GitHub Actions requires "write" access
      # to the "id-token" permission` and the publish fails outright -- see
      # `ensureProvenanceGeneration` in libnpmpublish/lib/publish.js.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # >= 22.14.0 is a trusted-publishing requirement, not just a floor
          # this repo picked. `22` resolves to the latest 22.x on the runner
          # image, which is well past it.
          node-version: 22
          cache: pnpm
          # No `registry-url`, deliberately, and this is the subtle half of the
          # OIDC switch. It makes setup-node write `$RUNNER_TEMP/.npmrc` holding
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` and point
          # `NPM_CONFIG_USERCONFIG` at it. With no `NODE_AUTH_TOKEN` in the
          # environment that placeholder is unresolved, and `pnpm publish`
          # copies the file into its pack directory before spawning npm -- so a
          # literal `${NODE_AUTH_TOKEN}` can reach the registry as a bearer
          # token and fail the publish that OIDC would otherwise have carried.
          # pnpm 10.17 added a guard that treats an unresolved placeholder as
          # empty; not writing the file at all does not depend on that guard.
          # npm defaults to registry.npmjs.org, so nothing is lost.
      - run: pnpm install --frozen-lockfile

      # Trusted publishing needs npm >= 11.5.1, and `node-version: 22` ships
      # npm 10.x. This is the step most easily left out, because nothing else in
      # the workflow depends on the npm version -- and without it the publish
      # fails unauthenticated rather than falling back to anything.
      #
      # It reaches the publish because `pnpm publish` does not talk to the
      # registry itself: it packs, then spawns `npm publish <tarball>` through
      # `runNpm(npmPath, ...)`, which resolves the binary from PATH
      # (`const npm = npmPath ?? "npm"`). So the npm upgraded here is the npm
      # that performs the publish and mints the OIDC token. pnpm needs no
      # trusted-publishing support of its own, and 10.34.5 has none.
      - run: npm install -g npm@latest
      # Printed, not assumed: a version below 11.5.1 here is the difference
      # between a working publish and an unauthenticated one.
      - run: npm --version

      # The gates, in the same job as the publish rather than as a separate
      # workflow, so the attestation covers artifacts this run actually
      # verified. These are the checks that say something about what ships;
      # `format:check`, `lint`, `docs:check` and the browser suites say
      # something about the source and already ran on `main` in `ci.yml`.
      #
      # Every install these gates run on is `--frozen-lockfile`, and none of
      # them resolves a dependency this repository does not pin -- which is what
      # keeps them here rather than in `package-verify` above. `test:bundle` and
      # `test:integrations` build `tests/bundle/*` and `tests/integrations/*`,
      # both globbed by `pnpm-workspace.yaml`, so the root lockfile and the
      # advisory floors govern them.
      #
      # typecheck first: it is `tsc -b`, and it emits the declaration files the
      # packages ship and the later checks read.
      - run: pnpm typecheck
      - run: pnpm test
      # Fails on any advisory reachable from a publishable package's own
      # `dependencies`, at any severity. It is the one check whose finding
      # travels to a consumer, and a consumer cannot patch it from their side.
      - run: pnpm test:audit
      # `test:bundle` and `test:integrations` drive a real browser.
      # No `actions/cache` here, unlike `ci.yml`: this workflow runs a handful
      # of times a year, so the cache would be cold on almost every run.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      # `test:packages` is deliberately absent: it runs in `package-verify`
      # above, which this job `needs:`. Do not add it back here.
      - run: pnpm test:budgets
      - run: pnpm test:bundle
      - run: pnpm test:integrations

      # Both publish steps below fail closed. If `inputs.dry_run` ever arrives
      # as the string "false" rather than the boolean, the first step runs
      # (a string is truthy) and the second does not (`"false" == false` is
      # false under GitHub's comparison rules) -- so the failure mode is a
      # second dry run, never an unintended publish.
      #
      # On both flags:
      #
      # `--access public`: required, not habitual. All seven names are new to
      # the registry, and libnpmpublish refuses provenance for a package it
      # cannot see as public -- "Can't generate provenance for new or private
      # package, you must set `access` to public."
      #
      # `--provenance`: documented for pnpm 10 (https://pnpm.io/10.x/cli/publish)
      # and accepted by the pinned 10.34.5, which rejects unknown options. But
      # under `-r` pnpm forwards only `--tag`, `--registry`, `--access`,
      # `--dry-run`, `--force` and `--otp` to the `npm publish` it spawns per
      # package, so this flag does not reach npm. What actually turns provenance
      # on is `publishConfig.provenance: true` in each of the seven manifests,
      # which npm reads back out of the packed tarball. The flag is kept because
      # it is correct and becomes load-bearing the day a manifest loses that
      # field -- but do not read its presence as proof provenance is on.
      #
      # `--no-git-checks`: the runner's checkout is a detached HEAD, which
      # pnpm's publish-branch check rejects.
      #
      # `-r`: publishes every workspace package that is not `private` and whose
      # exact version is not already on the registry. The seven come out of the
      # manifests; nothing here names them.
      #
      # Neither step carries a registry credential any more. Authentication is
      # trusted publishing over OIDC: npm exchanges the `id-token` granted above
      # for a short-lived registry token at publish time, against the trusted
      # publisher configured on each of the seven packages
      # (`pedrosousa13` / `playdeck` / `release.yml`, no environment).
      #
      # **The dry run cannot prove any of that.** npm never calls libnpmpublish
      # under `--dry-run`, so it never requests an OIDC token -- established on
      # #229, where an authenticated dry run passed and told us nothing. Under
      # the old token this step was still worth running authenticated; now it
      # proves strictly less, and only a real publish exercises the credential
      # path. It is kept because it still packs and resolves every package.
      - name: Publish (dry run)
        if: inputs.dry_run
        run: pnpm publish -r --access public --provenance --no-git-checks --dry-run
      - name: Publish
        if: inputs.dry_run == false
        run: pnpm publish -r --access public --provenance --no-git-checks
