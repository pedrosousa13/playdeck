name: Pages

# The Storybook workbench is the documentation — `README.md` says so — and
# until this file existed the only way to read it was to clone the monorepo and
# run a full workspace install, which somebody who ran `pnpm add @playdeck/react`
# has no reason and no instruction to do (#435). Publishing it makes that claim
# true for a consumer who has only ever seen npm.
#
# A repository has one Pages site and this workflow now publishes two surfaces
# into it: `apps/site` at the root, the workbench under `storybook/` (#519).
# They are built separately and assembled into one directory here, because
# neither build knows the other exists — each is handed the prefix it is served
# from and nothing else.
#
# `main` only. Deploying a branch would overwrite the published documentation
# with unreviewed content; `ci.yml`'s `storybook` job already proves on every
# pull request that the workbench build still succeeds, which is the part a
# pull request needs. The site build has no such pull-request gate yet — that
# is its own ticket (#528) — so until it lands a site build that only breaks
# under a base path breaks here first. `workflow_dispatch` is here to
# re-publish without an empty commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only, as in `ci.yml` and `release.yml`. The job below widens its own
# copy, and that is the only place the write scopes exist.
permissions:
  contents: read

# `cancel-in-progress: false` deliberately, unlike `ci.yml`, and for the reason
# `release.yml` gives for the same setting: the tail of this job publishes, and
# a publish interrupted partway is worse than a publish that waited. Two merges
# landing together cost a queued run, which is the cheaper failure.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Only runs where the Pages site exists. `release.yml` guards its
    # publishing jobs the same way and for the same reason: a fork inheriting
    # this file should not act on its own repository as a side effect of being
    # a fork.
    if: github.repository == 'pedrosousa13/playdeck'
    runs-on: ubuntu-latest
    # Install plus two static builds, an assembly and an upload — no browsers,
    # no packaging harness. `ci.yml` records its `storybook` job at 37s
    # whole-job, install included (2026-08-20, run 32337178101); the Astro
    # build of a placeholder page and a directory copy are small beside it, so
    # 15 minutes is still several times the work, in the same spirit as the
    # bounds there. Revisit it if the site grows a build that is not.
    timeout-minutes: 15
    permissions:
      # Naming a job-level `permissions` block replaces the workflow's rather
      # than adding to it, so `contents: read` is restated rather than
      # inherited. `pages: write` is what `deploy-pages` needs to create the
      # deployment; `id-token: write` is what lets the Pages service verify
      # which workflow produced the artifact it is being asked to publish.
      contents: read
      pages: write
      id-token: write
    # `deploy-pages` deploys *into* this environment, so it has to be declared
    # here. The URL is what puts a link to the published site on the run.
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `enablement: true` declares the repository's Pages state here rather
      # than leaving it to a settings click nobody can review, but it is a
      # fallback and not the mechanism: the action's own documentation says
      # enablement "requires a token other than GITHUB_TOKEN", because
      # `POST /repos/{owner}/{repo}/pages` wants `administration: write` and a
      # workflow `permissions:` block has no way to grant that.
      #
      # The site was created out of band before this workflow first ran, with
      # `build_type: workflow`, so `findOrCreatePagesSite` finds an existing
      # site and never reaches the create call. The flag is kept for the case
      # where that site is ever deleted, where it will work only if the run is
      # given a token that can administer the repository.
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true

      # A Pages project site is served from `/<repo>/` and never from the
      # domain root, so both surfaces have to resolve their assets and links
      # against that prefix. `PLAYDECK_BASE_PATH` is the one mechanism for
      # saying so: `apps/site/astro.config.ts` and
      # `apps/storybook/.storybook/main.ts` each read it into their bundler's
      # `base`, and this is the only place the two values differ. The site is
      # served from the artifact root and the workbench from `storybook/`
      # inside it, which is precisely the extra path segment below (#519).
      #
      # `base_path` comes back from the step above as `/playdeck`, without a
      # trailing slash, and a bundler `base` wants one. Taken from the step's
      # output rather than written out, so the repository name appears nowhere
      # in the tree and a custom domain later would need no edit here.
      - run: pnpm --filter @playdeck/site build
        env:
          PLAYDECK_BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - run: pnpm --filter @playdeck/storybook build
        env:
          PLAYDECK_BASE_PATH: ${{ steps.pages.outputs.base_path }}/storybook/

      # Where each build output lands in the artifact is the script's to say,
      # not this file's — the verification harness assembles the same layout,
      # and one definition is what keeps the two from drifting.
      - run: node scripts/assemble-pages.mjs pages-dist

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: pages-dist

      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
