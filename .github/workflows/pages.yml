name: Pages

# The Storybook workbench is the documentation — `README.md` says so — and
# until this file existed the only way to read it was to clone the monorepo and
# run a full workspace install, which somebody who ran `pnpm add @playdeck/react`
# has no reason and no instruction to do (#435). This publishes the same static
# build `ci.yml`'s `storybook` job already produces, so that claim is true for a
# consumer who has only ever seen npm.
#
# `main` only. A repository has one Pages site, so deploying a branch would
# overwrite the published documentation with unreviewed content; `ci.yml`'s
# `storybook` job already proves on every pull request that this build still
# succeeds, which is the part a pull request needs. `workflow_dispatch` is here
# to re-publish without an empty commit — note that GitHub only offers the
# button for workflows present on the default branch, so it is undispatchable
# until this file has merged once.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only, as in `ci.yml` and `release.yml`. The job below widens its own
# copy, and that is the only place the write scopes exist.
permissions:
  contents: read

# `cancel-in-progress: false` deliberately, unlike `ci.yml`, and for the same
# shape of reason `release.yml` gives: `deploy-pages` hands the artifact to the
# Pages service and then polls it, so cancelling a run mid-deploy abandons a
# deployment that is already happening rather than preventing one. Two merges
# landing together cost a queued run, which is the cheaper failure.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Install plus `storybook build` and nothing else — no browsers, no
    # packaging harness. Measured locally at 11s for the build alone on a warm
    # `node_modules`; 15 is several times an install-included run, in the same
    # spirit as the bounds in `ci.yml`.
    timeout-minutes: 15
    permissions:
      # Naming a job-level `permissions` block replaces the workflow's rather
      # than adding to it, so `contents: read` is restated rather than
      # inherited. `pages: write` is what `deploy-pages` needs to create the
      # deployment; `id-token: write` is what lets the Pages service verify
      # which workflow produced the artifact it is being asked to publish.
      contents: read
      pages: write
      id-token: write
    # `deploy-pages` deploys *into* this environment, so it has to be declared
    # here. The URL is what puts a link to the published site on the run.
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `enablement: true` so the repository's Pages state is declared here
      # rather than in a settings click nobody can review or reproduce.
      #
      # The one thing in this file that cannot be proven before it merges, so
      # it is stated rather than assumed: the action's own documentation says
      # enablement "requires a token other than GITHUB_TOKEN", because
      # `POST /repos/{owner}/{repo}/pages` wants `administration: write` and a
      # workflow `permissions:` block has no way to grant that. If the first
      # run fails on this step, enable Pages once by hand — Settings → Pages →
      # Source: GitHub Actions — after which `findOrCreatePagesSite` finds the
      # existing site and never reaches the create call again. Nothing else in
      # this workflow depends on the flag.
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true

      # A Pages project site is served from `/<repo>/` and never from the
      # domain root, so the fixtures the stories load out of `staticDirs` have
      # to be resolved against that prefix — `apps/storybook/stories/asset-url.ts`
      # is where that happens and `.storybook/main.ts` is where the prefix
      # arrives. `base_path` comes back from the step above as `/playdeck`,
      # without a trailing slash, and Vite's `base` wants one.
      #
      # Taken from the step's output rather than written out, so the repository
      # name appears nowhere in the tree and a custom domain later would need no
      # edit here. Everything Storybook itself emits is already relative, so
      # this moves the story fixtures and nothing else.
      - run: pnpm --filter @playdeck/storybook build
        env:
          PLAYDECK_BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      # `storybook build`'s output directory, which it writes relative to the
      # app and not to the repository root.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/storybook/storybook-static

      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
