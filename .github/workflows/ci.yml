name: CI

on:
  push:
    branches: [main]
  pull_request:

# No job here writes anything back to the repository, so the token they get
# should not be able to. Without this the workflow inherits the repository
# default, which is a write-capable token for every one of these jobs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Measured wall times on a healthy run (2026-08-20, run 32337178101): audit
# 12s, unit 31s, visual 37s, storybook 37s, static 52s, package 70s, e2e
# chromium 84s, firefox 115s, webkit 178s. These are whole-job times, install
# step included. The timeouts below are several times those, so they never
# fire on a run that is merely slow.
#
# Re-measured because #359 moved four of them. The figures they replace, taken
# on 2026-08-19 before that change, were visual 57s, storybook 64s, package
# 113s and chromium 162s — every one of those jobs installed OS packages then
# and does not now, so the old numbers describe a workflow that no longer
# exists. audit, unit, static, firefox and webkit were not changed by #359, so
# the movement in those is ordinary run-to-run variance and is what the spread
# here looks like.
#
# The one part that does not respect those figures is `playwright install`
# when it also installs OS packages, whose apt half has a long tail — see
# .github/actions/playwright-install. That is what the step-level bound there
# is for.
#
# They exist for the failure mode that actually happened: six job runs sat on
# `playwright install --with-deps`, which shells out to apt and blocks
# indefinitely rather than failing, for two hours. Without an explicit
# `timeout-minutes` a job inherits GitHub's six-hour default, so a wedged
# runner reads as "still running" for most of a working day. A job that goes
# red on its own is the whole point.
#
# Four of those six no longer touch apt. #359 measured that on this runner
# image chromium is missing no shared library at all — only fonts and X font
# utilities — so the action drops `--with-deps` for chromium, and
# `e2e (chromium)`, `visual`, `package` and `storybook` now download a browser
# binary and nothing else. `e2e (firefox)` and `e2e (webkit)` still install OS
# packages, so the apt exposure is cut from six job runs to two rather than
# removed, and every timeout below stays as it was. Which nine packages those
# are, and what their absence means for `visual`'s baselines, is in that
# action rather than repeated here.
#
# These job timeouts are the outermost of three limits and the one that should
# never fire. The install runs through `.github/actions/playwright-install`,
# which bounds it — 20 minutes when it calls apt, 10 when it only downloads a
# binary — and, on the apt path, samples what apt is doing while it runs and
# prints a post-mortem if the bound fires. That action states both bounds and
# how they were sized, so the numbers are not repeated here; the
# `timeout-minutes` on the four install steps below sits between the two.
#
# All four keep 22. That is deliberately slack wherever chromium is installed,
# since the action's own 10-minute bound always fires first there: lowering the
# step limit would change no behaviour, and one number across every call site
# is easier to keep true than a per-browser one. See #352 and #359.

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # typecheck first: it is `tsc -b`, which emits the package declarations
      # the examples project resolves through its `paths`. test:docs proves the
      # checker itself works before docs:check trusts it, and test:audit-unit
      # proves the story-fixture rule before test:story-fixtures runs it over
      # the workbench.
      - run: pnpm format:check && pnpm lint && pnpm typecheck && pnpm test:docs && pnpm test:audit-unit && pnpm test:story-fixtures && pnpm docs:check

  # A job rather than a step because a pull request runs its own copy of this
  # file: a deleted step leaves the job around it still reporting green,
  # whereas a deleted job never reports the `audit` context at all, and a
  # required context that never arrives blocks the pull request instead of
  # passing it. Standing alone also keeps the report readable.
  #
  # `pnpm test:audit` prints every advisory it found, each labelled with its
  # severity and with whether it is reachable from a non-private workspace
  # package's `dependencies`, and fails on reachability alone — at any
  # severity. Severity was the wrong axis: it fired hardest on the linting
  # toolchain, which never ships, and stayed quiet about a published
  # package's own runtime tree. See scripts/audit.mjs.
  #
  # That argument stopped at the workflow file, and the same bypass sits one
  # level below it: the verdict is `node scripts/audit.mjs`, an ordinary file
  # the same pull request can edit. Turning `process.exit(result.exitCode)`
  # into `process.exit(0)` leaves the `audit` context arriving, running and
  # green. So the authoritative run below takes the gate's *source* from
  # `main` rather than from the pull request.
  #
  # What that is, exactly, because it is narrower than "the gate is pinned":
  # pinned logic over inputs that are still mostly the pull request's. `main`
  # supplies the source, and — since #372 — the one third-party package that
  # source imports, unpacked beside the pinned copy below at the version `main`
  # pins so that upward resolution never reaches this tree looking for it. What
  # the pull request still supplies is the tree being measured, which is the
  # point of the gate rather than a residual, and the pnpm that corepack
  # resolves from its `packageManager`, which every job in this file already
  # trusts and which #372 deliberately left alone.
  #
  # A second is closed rather than open, and it is an input rather than logic:
  # the publishable boundary the gate measures against is declared in
  # pull-request-owned manifests (#373), which pinning cannot reach because
  # both copies read the same manifests and agree on the narrowed boundary. It
  # is fetched from `main` alongside the source below and compared, and the
  # gate fails when a package left it.
  #
  # A third was closed rather than filed, and is why pinning is worth having:
  # an `auditConfig` block in `pnpm-workspace.yaml` makes pnpm drop advisories
  # from `pnpm audit --json` before either copy of the gate reads it, so it
  # needed no edit to `audit.mjs` at all. `scripts/audit.mjs` now fails on one.
  # The two halves reinforce each other: that guard living on `main` is what
  # makes it unremovable by the pull request it judges, and the pinned run is
  # what carries it there.
  #
  # Both copies run, and either one failing fails the job. That is three
  # properties rather than one:
  #   - a pull request that weakens the gate still faces `main`'s copy;
  #   - a pull request that legitimately improves the gate still gets its own
  #     new version exercised, so the improvement stays testable in the pull
  #     request that makes it;
  #   - a pull request that breaks the gate is caught by its own copy failing.
  #
  # This is friction and not a fix, and is worth having on those terms. A pull
  # request can still edit this file and take the pinned run out. What it buys
  # is that neutering the gate is now a diff to a workflow file rather than
  # one character inside a script — the same argument the paragraph above
  # makes for `audit` being a job, carried one level down.
  # scripts/verify-packaging.mjs and scripts/check-bundle-budgets.mjs are
  # editable in-band the same way. They were left out of #337 so that one
  # worked example could land before the pattern spread; the `package` job now
  # runs both from `main`'s copy on this same mechanism (#376).
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `actions/checkout` is shallow and fetches only the ref under test, so
      # `main` is not in this clone and `origin/main` does not exist here —
      # hence the explicit fetch, read back through `FETCH_HEAD`.
      #
      # `scripts/audit.mjs` resolves both the repository root and
      # `pnpm-workspace.yaml` relative to its own location, so a copy exactly
      # one level below the root measures *this* pull request's tree while
      # executing *main*'s logic. What it reads that tree *with* is the gate
      # runtime further down. `--strip-components=1` is what puts `scripts/*` at
      # `.gate/*` rather than `.gate/scripts/*`. The whole directory is copied
      # rather than the two files it imports today, so `main`'s import closure
      # stays complete even if a pull request deletes a module it needs.
      #
      # `pipefail` and the `rm -rf` both bound what runs when the extraction
      # does not. The default step shell is `bash -e {0}`, where a pipeline's
      # status is its *last* command's, so `tar` alone decides that line — and
      # GNU tar's verdict on degenerate input is not uniform: measured, it
      # exits 2 on empty stdin but 0 on a well-formed empty archive. Rather
      # than rest on which of those a broken `git archive` happens to produce,
      # `pipefail` makes `git archive`'s own failure the pipeline's.
      #
      # `rm -rf` closes a substitution the extraction cannot. `git archive`
      # overwrites only the paths `main`'s `scripts/` actually carries, so
      # anything else a pull request committed under `.gate/` survives it —
      # and `.gate/node_modules/yaml/` is the one that bites, because Node
      # resolves a bare import from the nearest `node_modules` upward. A
      # committed one is found before this tree's, and `main`'s gate would
      # then parse `pnpm-workspace.yaml` with pull-request code. That is now
      # also the directory the gate runtime below is extracted into, which is
      # why the clear has to keep happening and has to keep happening first:
      # unpacking on top of a committed tree is not a replacement of it.
      #
      # `.gate-baseline/` answers the second residual named above (#373): the
      # publishable boundary both gates measure against is declared in
      # manifests the pull request owns, and pinning does not reach it because
      # both copies of the gate read the same pull-request-owned manifests and
      # so agree on a narrowed boundary. So `main`'s boundary is materialised
      # here and the gate compares against it, failing when a package left it.
      #
      # Manifests and the workspace file, and nothing else — no lockfile, no
      # install, no `node_modules`. `pnpm list -r --depth -1 --json` answers
      # from that alone, which is what keeps this to one `git archive` off the
      # fetch already above rather than a second checkout. That property is
      # pnpm's rather than ours, so scripts/workspace-packages.test.mjs builds
      # a tree with the enumeration below — every tracked `package.json` plus
      # `pnpm-workspace.yaml`, 18 manifests today — and runs a real invocation
      # against it.
      #
      # Every `package.json` in the tree is taken, not only the ones today's
      # globs match: which paths are in the workspace is precisely what the
      # comparison must not let the pull request decide, and the extra
      # manifests (the audit and packaging fixtures) sit outside `main`'s
      # `packages:` list and are inert. Inert is what makes taking all of them
      # safe rather than an aside, so the same test asserts it: the seven
      # fixture manifests are in that tree and are not projects in it.
      #
      # The enumeration is NUL-delimited from end to end — `-z` on `ls-tree`,
      # `grep -z`, `xargs -0` — because `git ls-tree` C-quotes any path that is
      # not printable ASCII (`core.quotePath`), which leaves a quoted string
      # that no longer ends in `package.json` for a line-oriented `grep` to
      # miss, and an unquoted `$(…)` word-splits a path holding a space into
      # two pathspecs. Neither is reachable in this tree today. Both would
      # narrow the baseline being compared against, which is the direction that
      # goes quiet rather than red.
      #
      # It also puts every stage inside the pipeline, where `pipefail` can see
      # it. The `$(git ls-tree … | grep …)` this replaced was a command
      # substitution, and a substitution's exit status is what neither `set -e`
      # nor `pipefail` inspects: a failing `git ls-tree`, or a `grep` matching
      # nothing, left `git archive` with `pnpm-workspace.yaml` alone and the
      # step walked on into `node .gate/audit.mjs`. That still failed closed,
      # and by the least legible error of the three available. Measured: `pnpm
      # list -r` over a workspace whose globs match no manifest prints nothing
      # and exits 0, so `workspaceProjects` dies inside `JSON.parse` with
      # "Unexpected end of JSON input" — not `publishableBaseline`'s guard,
      # which the workspace file being there satisfies, and not
      # `selectPublishable`'s "No publishable workspace packages were
      # discovered" either, which nothing reaches. None of that points an
      # operator at the extraction. Now `grep`'s exit 1 fails the line it went
      # wrong on.
      #
      # `-i` covers the one way `xargs` hands `tar` something other than a
      # single archive: given more paths than one command line holds it runs
      # `git archive` a second time, and GNU tar stops at the first archive's
      # end-of-archive marker unless told to read past it. 18 manifests are
      # nowhere near that limit, but the failure it would produce is a partial
      # baseline and not an error, so it is closed by a flag rather than by the
      # argument that it cannot happen.
      #
      # The comparison is against `main`'s *tip*, which is what `--depth=1`
      # fetches, and not against the merge base. Intended, not an oversight: a
      # branch behind `main` is judged against the boundary as it stands now,
      # which is the boundary consumers resolve — and the merge base would need
      # history this clone deliberately does not have.
      #
      # `PLAYDECK_PUBLISHABLE_BASELINE` is set on both runs below. Set means
      # the comparison is mandatory: `scripts/audit.mjs` fails when the
      # directory is missing, empty or carries no workspace file rather than
      # skipping quietly, because a gate that skips itself when its baseline is
      # absent is another bypass. Unset — a developer running `pnpm test:audit`
      # — compares nothing and prints nothing new. A pull request can still
      # edit this file and drop the variable, the same residual the paragraphs
      # above accept for the pinned run itself.
      #
      # The gate runtime — everything from the `gate_yaml=` read down to the
      # `node -e` that proves the extraction — is what #372 closed, and it sits
      # after the `rm -rf` and the `git archive` for a reason rather than by
      # arrangement: both of those have to have finished first, or it would be
      # decorating a `.gate/node_modules/` the pull request committed rather
      # than replacing it.
      #
      # What it fetches is `main`'s pinned version, read out of `main`'s own
      # manifest through the `FETCH_HEAD` this step already has. A literal here
      # would be a second place to bump and a second place to forget, and a
      # version read from *this* tree's manifest would hand the choice straight
      # back to the pull request. The read insists on an exact `x.y.z`, which is
      # what `main` carries today: a range would fetch whatever satisfies it on
      # the day, and a gate whose parser floats is not a pinned gate.
      #
      # `npm pack` and a `tar`, and not the `npm install` this began as. npm 11
      # runs a supply-chain policy check before it installs and asks the
      # operator about the result, and measured on npm 11.16.0 every way out of
      # that prompt is worse than it reads. On a TTY it prints `Continue install
      # ? (y/N)` and waits. With stdin redirected from `/dev/null` — the shape a
      # CI step has — it prints the prompt anyway and the package is not
      # installed. With `--yes` it exits 0 and the package is *still* not
      # installed, which is the dangerous one: a green step over an empty
      # `.gate/node_modules/` is this whole weakness back again, with the gate
      # resolving `yaml` out of the tree it is judging and nothing red to say
      # so. The runner's npm is 10.x today (`actions/setup-node` at
      # `node-version: 22`) and has no such prompt, so an install would probably
      # work here and now — but "probably, because the runner's npm is old
      # enough" is not a foundation for a control whose entire subject is
      # determinism. `npm pack` runs none of that check and is prompt-free on
      # both.
      #
      # Extracting the tarball is a whole install rather than half of one, and
      # that is a fact about `yaml` rather than about tarballs: it declares no
      # dependencies at all, so once its own files are on disk there is no
      # resolution left for an installer to do. npm tarballs carry everything
      # under `package/`, hence a `--strip-components=1` exactly like the `git
      # archive` above. Nothing executes during it either, which is what
      # `--ignore-scripts` bought on the install — obtaining a parser whose
      # whole purpose is not to run the pull request's code should not run
      # anybody's install hooks on the way — except that a `tar -x` has no hooks
      # to skip rather than hooks skipped by a flag.
      #
      # `--quiet` and not `--silent`: both drop the 233-line tarball listing npm
      # prints at notice level, but measured, `--silent` also swallows the
      # `ETARGET` on a version that does not exist and leaves a bare exit 1 with
      # nothing in the log to read.
      #
      # `npm` rather than `pnpm`, unchanged by any of the above and for the
      # unchanged reason. A pnpm install anywhere inside this checkout is
      # governed by the root `pnpm-workspace.yaml` — that is exactly why the
      # packaging fixture has to be copied out to a temp directory to escape it,
      # and why #336 then had to carry the file along by hand — and that file is
      # the one under test here, `overrides` block and all. So pnpm would let
      # the pull request redirect the gate's own fetch, which is this weakness
      # arriving through the package manager rather than through resolution. npm
      # reads nothing out of that file. And the `npm` on PATH is Node's own:
      # `corepack enable` above leaves npm out of the set it shims by default
      # (corepack's own `SupportedPackageManagerSetWithoutNpm`), so this does
      # not route the gate's fetch through the package manager the pull
      # request's `packageManager` field selects either.
      #
      # npm has a redirect of its own, though, and it is a different file rather
      # than the same one read twice — which is why the fetch runs from outside
      # the checkout. npm ignores `pnpm-workspace.yaml`; it does not ignore a
      # project `.npmrc`, and the project it takes one from is found by walking
      # up from the working directory, which for a step whose commands all run
      # in the checkout is the pull request's tree. So a pull request that
      # commits a `registry=` line serves the gate its own `yaml`, and the
      # `node -e` below passes on it: the name, the version and a callable
      # `parse` are all whatever was published under that spec. Measured both
      # ways with `registry=https://example.invalid/` committed at the root —
      # run from the checkout, `npm pack` fails with `network request to
      # https://example.invalid/yaml failed`; run with `env -C` naming the
      # `mktemp -d`, the same command does not see the file at all and fetches
      # the real tarball. Only the working directory moves: `--pack-destination`
      # still names that same directory, so the tarball lands where the `tar`
      # below looks for it. The two `npm_config_*` variables answer the same
      # question for the user and global config, which this workflow does not
      # control either, and they name two absent paths rather than `/dev/null`
      # twice because npm refuses to load one file as both and exits before it
      # resolves any config at all.
      #
      # Every stage of it reddens the step, which took arranging, because
      # `set -e` is easier to slip past than it reads. A bare assignment's
      # status *is* its command substitution's, so a failed `node` read and a
      # failed `npm pack` each fail the line they went wrong on — unlike the
      # substitution-as-an-argument this block already had to reason about above
      # (#373). What that does not catch is a stage that succeeded and produced
      # nothing, so both results are expanded with `:?`: an empty version would
      # reach `npm pack` as `yaml@`, which packs the latest release rather than
      # refusing the spec and is precisely the float being closed, and an empty
      # tarball name would hand `tar` the pack directory itself.
      #
      # The tarball is written to a `mktemp -d` outside the workspace and
      # deleted once extracted, so nothing that could be mistaken for repository
      # content is left behind for a later step to read. The `rm -rf` is not
      # reached when `npm pack` or `tar` fails, and that is left alone rather
      # than wrapped in a `trap`: the directory is outside the checkout, so no
      # later step reads it either way, and the runner is thrown away whole at
      # the end of the job. Tidiness on a path where the step has already gone
      # red buys nothing.
      #
      # Then the extraction is proved rather than assumed, in this step and not
      # only inside the gate. `require.resolve` starting from `.gate/` and
      # answering a path outside it means nothing landed and the walk upward
      # reached this tree's copy; a version that is not the pinned one means
      # something landed at the wrong depth or from the wrong spec; and the
      # module is actually loaded, so a tarball that unpacked into a shape Node
      # cannot read fails here rather than a line later. `gate-parser.mjs`
      # asserts its own resolution too and that remains the backstop, but a
      # runtime that never arrived should go red where it was supposed to
      # arrive.
      #
      # `PLAYDECK_GATE_MODULES` is what makes the runtime provable to the gate
      # instead of assumed, and it is asserted inside the gate rather than here.
      # `scripts/gate-parser.mjs` — pinned along with the rest of `.gate/`, and
      # the only place any gate script names a third-party package — resolves
      # `yaml` without loading it, fails unless the answer sits inside the
      # directory named here, and imports it only then. A bare specifier
      # resolves from the importing file's own directory, so the module doing
      # the importing is the only place *that* check can be made: the
      # `require.resolve` above answers a neighbouring question — whether the
      # extraction landed — in another process, and not the question of what
      # `.gate/audit.mjs` will reach when it asks for `yaml`. Set means
      # mandatory once more — a runtime that is not there, or a parser found
      # anywhere else, is a red step rather than a quiet fall back to this
      # tree's copy, and falling back silently is the defect rather than the
      # fix. It is set on the pinned run alone: the pull request's own run below
      # resolves its own `node_modules` by design, and asserting otherwise there
      # would fail a step that is behaving.
      - name: Audit — main's copy of the gate
        env:
          PLAYDECK_PUBLISHABLE_BASELINE: ${{ github.workspace }}/.gate-baseline
          PLAYDECK_GATE_MODULES: ${{ github.workspace }}/.gate/node_modules
        run: |
          set -o pipefail
          git fetch --depth=1 origin main
          rm -rf .gate .gate-baseline
          mkdir -p .gate .gate-baseline
          git archive FETCH_HEAD scripts | tar -x --strip-components=1 -C .gate
          git ls-tree -r -z --name-only FETCH_HEAD \
            | grep -zE '(^|/)package\.json$' \
            | xargs -0 git archive FETCH_HEAD pnpm-workspace.yaml \
            | tar -x -i -C .gate-baseline
          gate_yaml="$(git show FETCH_HEAD:package.json | node -e '
            const manifest = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            const version = String(manifest.devDependencies?.yaml);
            if (!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(version))
              throw new Error("main does not pin yaml to an exact version: " + version);
            process.stdout.write(version);
          ')"
          gate_pack="$(mktemp -d)"
          gate_tarball="$(env -C "$gate_pack" \
            npm_config_userconfig="$gate_pack/absent-user-npmrc" \
            npm_config_globalconfig="$gate_pack/absent-global-npmrc" \
            npm pack --quiet --pack-destination "$gate_pack" \
            "yaml@${gate_yaml:?the yaml version pinned on main could not be read}")"
          mkdir -p .gate/node_modules/yaml
          tar -x -f "$gate_pack/${gate_tarball:?npm pack named no tarball}" \
            --strip-components=1 -C .gate/node_modules/yaml
          rm -rf "$gate_pack"
          node -e '
            const { realpathSync } = require("node:fs");
            const { sep } = require("node:path");
            const expected = process.argv[1];
            const gate = realpathSync(".gate") + sep;
            const entry = require.resolve("yaml", { paths: [gate] });
            if (!entry.startsWith(gate))
              throw new Error("the gate runtime is not under " + gate + ": yaml resolved to " + entry);
            const { version } = require(gate + "node_modules/yaml/package.json");
            if (version !== expected)
              throw new Error("the gate runtime holds yaml@" + version + ", not the pinned " + expected);
            if (typeof require(entry).parse !== "function")
              throw new Error("the yaml in the gate runtime, at " + entry + ", exports no parse()");
          ' "$gate_yaml"
          node .gate/audit.mjs
      # Runs even when the pinned copy above failed, so one run never hides
      # the other's verdict: the two disagreeing is the interesting case.
      - name: Audit — this pull request's copy of the gate
        if: ${{ !cancelled() }}
        env:
          PLAYDECK_PUBLISHABLE_BASELINE: ${{ github.workspace }}/.gate-baseline
        run: pnpm test:audit

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # a11y-media.spec.ts arranges its live-region window instead of racing it:
  # since #279 the clip is rewound to 0 and settled there before the mutation
  # observer installs, so nothing in that test is a margin against runner speed,
  # and none of it was ever a player performance budget. See
  # e2e/a11y-media.spec.ts for the full rationale.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright-version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      # The install below is never gated on a cache hit. A restored tree that
      # is missing the browser binary would skip the install and fail every
      # test with "Executable doesn't exist"; `playwright install` is a fast
      # no-op when the browser is already there, so it always runs.
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright-version.outputs.version }}
      - uses: ./.github/actions/playwright-install
        timeout-minutes: 22
        with:
          browser: ${{ matrix.browser }}
      # `test:e2e`'s Playwright config builds `apps/site` to serve the
      # `site-*` specs (`playwright.config.ts`'s second `webServer`), so this
      # job needs the same `ffmpeg` check and media cache the `site` job has.
      - uses: ./.github/actions/sprite-fright-media
      # pnpm appends extra CLI args to the end of a compound script rather than
      # inserting a `--` separator, so this lands on the `playwright test` half.
      - run: pnpm test:e2e --project=${{ matrix.browser }}

  # Chromium only, and its own job rather than a leg of the `e2e` matrix: the
  # PNG baselines in `e2e/__screenshots__` are generated on this runner image
  # and compared on it, so a red run here means either a real visual change or
  # a runner-image change, and neither should be buried in a three-engine
  # matrix. On macOS those five tests skip; the layering assertions in the same
  # spec run everywhere.
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright-version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ steps.playwright-version.outputs.version }}
      - uses: ./.github/actions/playwright-install
        timeout-minutes: 22
        with:
          browser: chromium
      # `test:e2e`'s Playwright config builds `apps/site` to serve the
      # `site-*` specs (`playwright.config.ts`'s second `webServer`), so this
      # job needs the same `ffmpeg` check and media cache the `site` job has.
      - uses: ./.github/actions/sprite-fright-media
      # pnpm appends extra CLI args to the end of a compound script rather than
      # inserting a `--` separator, so this lands on the `playwright test` half.
      - run: pnpm test:e2e --project=visual
      # The -actual and -diff PNGs. Without these a red run says "images
      # differ" and gives nobody a way to see how.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff
          path: test-results/
          retention-days: 14

  # `pnpm test:packages` runs `scripts/verify-packaging.mjs`, which installs
  # each packed tarball into a throwaway fixture project. The repo pins
  # pnpm@10.34.5 in package.json: pnpm 11's SQLite store index failed this job
  # with `[ERR_SQLITE_ERROR] attempt to write a readonly database`, and 10.34.5
  # predates that index entirely.
  #
  # That root pin does not reach the fixture install, which is the half of this
  # that was never true: the fixture is copied to an OS temp directory, where
  # corepack finds no manifest above it and falls back to whatever pnpm is
  # latest that day. `tests/packaging/fixture/package.json` therefore repeats
  # the same `packageManager`, and that is also what keeps the fixture's
  # committed lockfile replayed rather than re-resolved under a newer
  # `lockfileVersion`. See #336.
  #
  # `timeout-minutes` stays at 30 even though #376 made that harness run twice,
  # which is the obvious thing to check when a job's most expensive step
  # doubles. Measured across three `main` runs: `pnpm test:packages` took 15s,
  # 20s and 20s inside whole jobs of 57s, 61s and 65s. A second run of it, plus
  # a second run of a budget check that costs about a second, leaves this job
  # comfortably under two minutes against a thirty-minute cap.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright-version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - uses: ./.github/actions/playwright-install
        timeout-minutes: 22
        with:
          browser: chromium
      # `pnpm build` is `turbo run build`, which includes `@playdeck/site`:
      # its `build` script runs `scripts/media-sprite-fright.mjs` before
      # `astro build`, the same as `site` and `deploy-site.yml`. Same
      # defensive `ffmpeg` check, same cache, keyed the same way.
      - uses: ./.github/actions/sprite-fright-media
      # Builds every package once via the Turborepo cache; test:packages,
      # test:bundle and test:integrations below rebuild the same package set
      # and hit that cache instead of rebuilding from scratch. It also has to
      # precede every gate run below, pinned or not: both gates read what this
      # step produced, and `main`'s copies read it through the same paths this
      # pull request's copies do.
      - run: pnpm build
      # `main`'s copies of the two gate scripts this job runs. The `audit` job
      # above carries the full argument for taking a gate's *source* from
      # `main`; this is that mechanism applied to the two scripts #337
      # deliberately left behind, one worked example having landed first
      # (#376). The short form: `scripts/verify-packaging.mjs` and
      # `scripts/check-bundle-budgets.mjs` are ordinary files the pull request
      # they judge can edit, and softening either one's failure path — the
      # `process.exit(1)` the packaging harness ends on, the `throw` the budget
      # check ends on — leaves both of this job's checks arriving, running and
      # green.
      #
      # Every line below is the `audit` job's, for the reasons set out there at
      # length and repeated here only in brief. `actions/checkout` is shallow
      # and fetches only the ref under test, so `main` is not in this clone and
      # `origin/main` does not exist here — hence the explicit fetch, read back
      # through `FETCH_HEAD`. `pipefail` makes a failed `git archive` the
      # pipeline's failure instead of leaving the verdict to `tar`, whose
      # treatment of degenerate input is not uniform. `rm -rf` removes whatever
      # a pull request committed under `.gate/` that the extraction would not
      # overwrite, `.gate/node_modules/` above all: Node resolves a bare import
      # from the nearest `node_modules` upward, and `verify-packaging.mjs`
      # imports `@playwright/test` that way — and it is also where the gate
      # runtime below is extracted, so the clear has to come first or that
      # unpacking decorates a committed tree instead of replacing it.
      # `--strip-components=1` is what puts `scripts/*` at `.gate/*` rather than
      # `.gate/scripts/*`, which is what leaves the copy exactly one level below
      # the repository root — the depth both scripts resolve their paths from,
      # and the whole reason they transfer here unchanged. The directory is
      # copied whole rather than file by file so `main`'s import closure stays
      # complete even if a pull request deletes a module it needs.
      #
      # One extraction rather than one per pinned run: both runs read the same
      # directory, and re-fetching between them would buy a second network
      # round trip and a second way to fail without changing a line of what
      # executes.
      #
      # What this is, in the same terms the `audit` job uses: pinned logic over
      # inputs that are still mostly the pull request's. `main` supplies the two
      # scripts, and the parser one of them reads YAML with — the gate runtime
      # fetched below is the `audit` job's, verbatim and for the reasons stated
      # there at length — `npm pack` over `npm install`, and a working directory
      # outside this checkout so the pull request's own `.npmrc` cannot redirect
      # the fetch, among them (#372).
      # `verify-packaging.mjs` needs it as much as the audit gate does, one
      # level less obviously: it imports `./packaging-fixture.mjs`, and that
      # file is what synthesises the fixture's `pnpm-workspace.yaml` from this
      # repository's own, so a redirected parser rewrites the floors and the
      # cooldown the fixture install runs under (#336) as well as hiding them.
      # `check-bundle-budgets.mjs` imports nothing third-party at all —
      # `node:zlib`, `node:fs/promises`, `node:url` — so nothing about it needs
      # a runtime and its step names none.
      #
      # `@playwright/test` is the open half, stated rather than hidden. The
      # packaging harness drives a real browser through it, resolved out of the
      # pull request's own `node_modules` exactly as `yaml` used to be, and a
      # pull request that redirects that name runs its own code inside `main`'s
      # harness. #372 closed the parser and deliberately not this: a browser
      # driver is a heavy thing to fetch per job, and one with a dependency tree
      # that a tarball extraction would not resolve, so it is a decision of its
      # own rather than another line beside this one. It is the sharpest
      # residual this job carries and it is not filed yet.
      #
      # The pull request still supplies the tree the two scripts measure, which
      # is the point of both gates rather than a residual, the fixture under
      # `tests/packaging/`, and the pnpm that corepack resolves from
      # `packageManager` — which every job in this file already trusts and
      # which #372 left alone on purpose.
      #
      # One residual that would otherwise belong in that list is already closed,
      # elsewhere: the publishable boundary `verify-packaging.mjs` draws is
      # declared in pull-request-owned manifests, which pinning cannot reach
      # because both copies read the same manifests and agree on a narrowed one.
      # `scripts/workspace-packages.mjs` is the single definition of that
      # boundary and the packaging harness and the audit gate both import it, so
      # the `audit` job materialising `main`'s boundary and failing on a
      # departure (#373) covers this job too. Hence no baseline here.
      - name: Fetch main's copy of the gate scripts and the parser they read with
        run: |
          set -o pipefail
          git fetch --depth=1 origin main
          rm -rf .gate
          mkdir -p .gate
          git archive FETCH_HEAD scripts | tar -x --strip-components=1 -C .gate
          gate_yaml="$(git show FETCH_HEAD:package.json | node -e '
            const manifest = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            const version = String(manifest.devDependencies?.yaml);
            if (!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(version))
              throw new Error("main does not pin yaml to an exact version: " + version);
            process.stdout.write(version);
          ')"
          gate_pack="$(mktemp -d)"
          gate_tarball="$(env -C "$gate_pack" \
            npm_config_userconfig="$gate_pack/absent-user-npmrc" \
            npm_config_globalconfig="$gate_pack/absent-global-npmrc" \
            npm pack --quiet --pack-destination "$gate_pack" \
            "yaml@${gate_yaml:?the yaml version pinned on main could not be read}")"
          mkdir -p .gate/node_modules/yaml
          tar -x -f "$gate_pack/${gate_tarball:?npm pack named no tarball}" \
            --strip-components=1 -C .gate/node_modules/yaml
          rm -rf "$gate_pack"
          node -e '
            const { realpathSync } = require("node:fs");
            const { sep } = require("node:path");
            const expected = process.argv[1];
            const gate = realpathSync(".gate") + sep;
            const entry = require.resolve("yaml", { paths: [gate] });
            if (!entry.startsWith(gate))
              throw new Error("the gate runtime is not under " + gate + ": yaml resolved to " + entry);
            const { version } = require(gate + "node_modules/yaml/package.json");
            if (version !== expected)
              throw new Error("the gate runtime holds yaml@" + version + ", not the pinned " + expected);
            if (typeof require(entry).parse !== "function")
              throw new Error("the yaml in the gate runtime, at " + entry + ", exports no parse()");
          ' "$gate_yaml"
      # `verify-packaging.mjs` resolves the repository root from its own module
      # URL and builds every fixture at an absolute `tmpdir()` path, so a copy
      # in `.gate/` packs and installs *this* pull request's packages while
      # executing *main*'s logic. Its local imports — `./workspace-packages.mjs`,
      # `./packaging-fixture.mjs` and `./shipped-changelog.mjs` — ride along in
      # the whole-directory copy.
      #
      # `node .gate/verify-packaging.mjs` and not `pnpm test:packages`, here and
      # for the budget check below. That is the point rather than a shortcut:
      # `package.json`'s `test:packages` and `test:budgets` entries are
      # themselves pull-request-owned, so routing the pinned run through one
      # would hand straight back the bypass this closes — the gate's source
      # would come from `main` and the choice of what to run would not.
      #
      # `!cancelled()` here as well as on the three gate steps below it, so all
      # four run whatever the step before them did. On this first one it decides
      # what happens when the fetch above fails: the pinned run no longer skips,
      # it runs and dies on a missing `.gate/`. Nothing new is caught by that —
      # a failed fetch already reddens the job on its own — but the failure is
      # loud and lands in the step whose input is missing, rather than that step
      # vanishing from the log as a skip. It is one step further than the
      # `audit` job goes, whose first pinned run keeps the default `success()`,
      # and the difference is deliberate: this job runs four gate steps in
      # sequence rather than two, so a skip early in the chain hides more.
      #
      # `PLAYDECK_GATE_MODULES` names the directory the step above extracted
      # into, and `main`'s `scripts/gate-parser.mjs` — reached from here through
      # `./packaging-fixture.mjs` — fails this step unless that is where `yaml`
      # resolved from (#372). Set on the pinned run alone, for the reason the
      # `audit` job gives: the pull request's own run below resolves its own
      # `node_modules` by design. The two budget steps name no runtime because
      # `check-bundle-budgets.mjs` imports nothing from `node_modules`: its only
      # import is the sibling `./bundle-budgets.mjs`, which is a relative path.
      - name: Packaging — main's copy of the gate
        if: ${{ !cancelled() }}
        env:
          PLAYDECK_GATE_MODULES: ${{ github.workspace }}/.gate/node_modules
        run: node .gate/verify-packaging.mjs
      # Runs even when the pinned copy above failed, so one run never hides the
      # other's verdict: the two disagreeing is the interesting case. Both
      # copies run and either failing fails the job, which is the same three
      # properties the `audit` job lists — a weakened gate still faces `main`'s
      # copy, a legitimately improved one is still exercised by the pull request
      # that improves it, and a broken one is caught by its own copy failing.
      - name: Packaging — this pull request's copy of the gate
        if: ${{ !cancelled() }}
        run: pnpm test:packages
      # `check-bundle-budgets.mjs` resolves the repository root as
      # `new URL('../', import.meta.url)` and `scripts/bundle-budgets.mjs` joins
      # each target path onto it. `.gate/` sits at the same depth as `scripts/`,
      # so that root resolves from `.gate/` to exactly the directory it resolves
      # to from `scripts/`, and every target with it. Seven of the eight are
      # build outputs at `../packages/*/dist/index.js`, the ones `pnpm build`
      # above produced; the eighth is `../packages/react/theme.css`, which is
      # neither under `dist/` nor built at all — it is plain CSS the package
      # ships as-is, so the pinned run measures the file this pull request
      # committed. Both shapes resolve identically from either directory, which
      # is the only property this step needs. Nothing else in the script is
      # location-sensitive, and its one import — the sibling
      # `./bundle-budgets.mjs`, which the whole-directory copy above brings with
      # it — is a relative path rather than anything a runtime has to resolve.
      #
      # The same `!cancelled()`, and here is the concrete instance of why every
      # gate step in this job carries it: under the default `success()` a red
      # packaging step above would skip the budget gate outright, and a gate
      # that a neighbouring failure can silence is one more thing a pull request
      # can aim at.
      - name: Bundle budgets — main's copy of the gate
        if: ${{ !cancelled() }}
        run: node .gate/check-bundle-budgets.mjs
      - name: Bundle budgets — this pull request's copy of the gate
        if: ${{ !cancelled() }}
        run: pnpm test:budgets
      # These two keep the default `success()`, so any of the four gate steps
      # above failing skips them. #376 widened when that happens rather than
      # introducing it: the pinned copies can now fail where before only the
      # pull request's own two steps could, which includes the case the comments
      # above call the interesting one — `main`'s copy failing while the pull
      # request's copy passes. Left on `success()` on purpose. They are not
      # gates this issue pins, the job is already failing by the time they would
      # be skipped, and running more of a job that is going red anyway proves
      # nothing. Widening them would be a decision about different steps.
      - run: pnpm test:bundle
      - run: pnpm test:integrations
      # The README's byte table is generated from the same measurements
      # `pnpm test:budgets` gates against, so a change that moves a bundle
      # cannot leave a stale figure in the prose (#511). It runs here and not
      # beside `docs:check` in `static` for one reason: `static` builds no
      # packages, and the first-party figures are the gzipped size of a built
      # `dist/index.js`. `pnpm build` above is what makes them measurable, and
      # duplicating that build into `static` would cost more than the check.
      # The third-party figures are read from `node_modules`, which every job
      # installs.
      - run: pnpm docs:bytes:check
      # Needs the same built `dist/` as the step above, for the same reason:
      # the Playdeck figure is the gzipped size of a real bundle, not a typed
      # number. The third-party libraries it measures are pinned exact
      # versions in tests/compare/package.json and resolved by the lockfile,
      # so this step reads no version this job has not already installed.
      - run: pnpm compare:libraries:check

  # Every job in this workflow runs on Linux, deliberately. A macOS job
  # (`hls-native-webkit`) used to run the WebKit HLS suite here, because
  # native HLS needs Safari's media stack and Playwright's Linux WebKit has
  # neither native HLS nor the proprietary codecs. It was removed as a
  # maintainer decision to keep CI on one OS.
  #
  # What that costs, stated plainly so nobody rediscovers it as a surprise:
  # `e2e/hls.spec.ts`'s "plays the local hls fixture natively without
  # downloading hls.js" self-skips unless it is on WebKit *and* darwin
  # (`hls.spec.ts:46-49`), so no CI job runs it any more and nothing else
  # covers the native-HLS path on a real Safari media stack. The test is kept
  # rather than deleted: it still runs for anyone working on a Mac, and it
  # documents the gap. The `hls-paths` job that gated the macOS run went with
  # it, having nothing left to gate.

  # The site, gated on every pull request rather than discovered broken after a
  # merge (#528). Its own job, which is the whole shape of the requirement: this
  # runs beside `static`, `unit`, `audit` and the rest rather than in front of
  # them, so the gate a pull request already waited for is not slower for the
  # site existing. The trade is one more runner, which this workflow already
  # spends seven of.
  #
  # A job rather than two steps bolted onto `static`, for two reasons. `static`
  # deliberately does not build — it is the fast pass, and every check in it
  # reads source — while both checks here read build output, and the second one
  # cannot exist without the first. And `static` at 52s is the job a pull
  # request's author watches; prepending a package build and an Astro build to
  # it would move the fastest signal in this file behind the slowest thing it
  # newly does.
  #
  # What is *not* here is a typecheck, and its absence is deliberate rather than
  # an omission: `apps/site` is a project reference of the root `tsconfig.json`,
  # so `pnpm typecheck` in `static` above already builds it, and a second `tsc`
  # over the same project would report the same errors one job later. The
  # `.astro` templates are not in that project — `tsc` cannot parse them — and
  # what checks them is the build below: `astro build` renders every page, so a
  # template that names something undefined fails here by name.
  #
  # `pnpm exec turbo run build --filter=@playdeck/site...` and not
  # `pnpm --filter @playdeck/site build`, because the trailing `...` is what
  # pulls in the packages the site cannot be built without: the landing page
  # imports `@playdeck/react` through its published entry and measures every
  # built bundle for the figures it prints, so a site build against an unbuilt
  # tree fails on the measurement. `deploy-site.yml` builds the same two halves
  # in the same order and spells them as two `pnpm --filter` commands, which
  # `scripts/check-deploy-artifact.mjs` mirrors exactly so that what the check
  # assembles is what the deploy would.
  #
  # Nor does anything here drive a browser over the site, and that is not a gap
  # either: the `site-*` specs do, in the `e2e` matrix above, whose
  # Playwright `webServer` builds this same site and serves it on 4322. Running
  # it here as well would build the site twice per pull request to assert the
  # same things in the same browser.
  #
  # 15 minutes, matching `static` and `audit`: this job installs no browser and
  # drives none. What it does that they do not is reach the network, and the
  # link check bounds every request it makes at 15 seconds with at most three
  # attempts — so a wholly unreachable third party costs it under a minute per
  # URL rather than a hung job. The bound is reasoned rather than measured: no
  # run of this job on a GitHub runner exists to read a figure off yet, unlike
  # every number in the block at the head of this file.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # As in `deploy-site.yml`: `apps/site/package.json`'s `build` runs
      # `scripts/media-sprite-fright.mjs` before `astro build`, so this job
      # builds the same self-hosted clip that job deploys. Same defensive
      # `ffmpeg` check, same cache, keyed the same way, so a pull request that
      # touches neither the script nor the source film pays for neither the
      # download nor the encode.
      - uses: ./.github/actions/sprite-fright-media
      - run: pnpm exec turbo run build --filter=@playdeck/site...
      - run: pnpm test:site-analytics
      # Reads the build the step above produced, which is what lets it see the
      # base path a visitor sees rather than the template that was meant to
      # produce it. It checks the external URLs too, and distinguishes a
      # transient network failure from a definitive removal — only the second
      # fails this job. scripts/check-site-links.mjs carries both arguments.
      - run: pnpm test:site-links

  # 25 rather than 20: the install step is bounded at 22 minutes (see
  # .github/actions/playwright-install), and a 20-minute job cap left no room
  # above it. This job's own install measured 690s on a successful run, so 20
  # was tight for it regardless — though that 690s was apt, which this job no
  # longer calls now that chromium installs without `--with-deps`.
  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright-version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - uses: ./.github/actions/playwright-install
        timeout-minutes: 22
        with:
          browser: chromium
      - run: pnpm --filter @playdeck/storybook build
      - run: pnpm test:storybook
