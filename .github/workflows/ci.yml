name: CI

on:
  push:
    branches: [main]
  pull_request:

# No job here writes anything back to the repository, so the token they get
# should not be able to. Without this the workflow inherits the repository
# default, which is a write-capable token for every one of these jobs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: [self-hosted, linux, x64, vps]
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # typecheck first: it is `tsc -b`, which emits the package declarations
      # the examples project resolves through its `paths`. test:docs proves the
      # checker itself works before docs:check trusts it.
      - run: pnpm format:check && pnpm lint && pnpm typecheck && pnpm test:docs && pnpm test:audit-gate && pnpm docs:check

  # A job rather than a step because a pull request runs its own copy of this
  # file: a deleted step leaves the job around it still reporting green,
  # whereas a deleted job never reports the `audit` context at all, and a
  # required context that never arrives blocks the pull request instead of
  # passing it. Standing alone also keeps the report readable.
  #
  # `pnpm test:audit` prints every advisory it found, each labelled with its
  # severity and with whether it is reachable from a non-private workspace
  # package's `dependencies`, and fails on reachability alone — at any
  # severity. Severity was the wrong axis: it fired hardest on the linting
  # toolchain, which never ships, and stayed quiet about a published
  # package's own runtime tree. See scripts/audit.mjs.
  audit:
    runs-on: [self-hosted, linux, x64, vps]
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:audit

  unit:
    runs-on: [self-hosted, linux, x64, vps]
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Moved to the self-hosted runner: a11y-media.spec.ts's cue-boundary guard
  # (installedAt < cueBoundary) was genuinely about proving the mutation
  # observer installs before the fixture's real cue transition, not about a
  # player performance budget, so the fix moved the fixture's cue boundary
  # itself (captions-reference.vtt, 0.4s -> 0.7s) together with the matching
  # JS constant, giving this host's 0.46-0.54s install time real headroom
  # without decoupling the guard from what it's actually guarding. See
  # e2e/a11y-media.spec.ts for the full rationale.
  e2e:
    runs-on: [self-hosted, linux, x64, vps]
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright-version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      # No cache-hit gate on the install below. On the self-hosted runner the
      # home directory persists between jobs, so ~/.cache/ms-playwright is
      # already warm; layering actions/cache over it produced a cache hit whose
      # restored tree lacked the browser binary, the install step was skipped,
      # and every e2e test failed with "Executable doesn't exist". `playwright
      # install` is a fast no-op when the browser is already present, so just
      # always run it. The cache is kept so a fallback to a hosted runner still
      # benefits.
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright-version.outputs.version }}
      # `--with-deps` shells out to `apt-get` via sudo to install OS packages,
      # which this runner's unprivileged user does not have. The self-hosted
      # host already carries Playwright's system libraries host-wide, so only
      # the browser binary itself needs fetching here — no OS deps step is
      # needed at all, cache hit or miss.
      - run: pnpm exec playwright install ${{ matrix.browser }}
      # pnpm appends extra CLI args to the end of a compound script rather than
      # inserting a `--` separator, so this lands on the `playwright test` half.
      - run: pnpm test:e2e --project=${{ matrix.browser }}

  # Chromium only, and its own job rather than a leg of the `e2e` matrix: the
  # PNG baselines in `e2e/__screenshots__` are generated on this runner image
  # and compared on it, so a red run here means either a real visual change or
  # a runner-image change, and neither should be buried in a three-engine
  # matrix. On macOS those five tests skip; the layering assertions in the same
  # spec run everywhere.
  visual:
    runs-on: [self-hosted, linux, x64, vps]
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright-version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ steps.playwright-version.outputs.version }}
      # `--with-deps` shells out to `apt-get` via sudo, which this runner's
      # unprivileged user does not have. The self-hosted host already carries
      # Playwright's system libraries host-wide, so only the browser binary
      # itself needs fetching — no OS deps step is needed, cache hit or miss.
      - run: pnpm exec playwright install chromium
      # pnpm appends extra CLI args to the end of a compound script rather than
      # inserting a `--` separator, so this lands on the `playwright test` half.
      - run: pnpm test:e2e --project=visual
      # The -actual and -diff PNGs. Without these a red run says "images
      # differ" and gives nobody a way to see how.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff
          path: test-results/
          retention-days: 14

  # Moved to the self-hosted runner. `pnpm test:packages` used to die under
  # this repo's pinned pnpm 11.15.1 with `[ERR_SQLITE_ERROR] attempt to write
  # a readonly database` from its new SQLite store index — reproduced 3/3
  # against the real shared store and traced to pnpm 11's index itself, not a
  # host permissions or concurrency problem (both investigated and
  # disproven). Fixed by dropping the `packageManager` pin to pnpm@10.34.5
  # (package.json), which predates the SQLite store index entirely, matching
  # the version this host also pins at /usr/local/bin/pnpm.
  #
  # That alone wasn't sufficient: `scripts/verify-packaging.mjs`'s fixture
  # install runs from a directory under Node's default tmpdir (`/tmp`), which
  # is tmpfs here — a different filesystem device than `HOME`/the workspace
  # (`/srv/runner`, on disk). Under pnpm 10 that device mismatch makes pnpm
  # colocate a store at `/tmp/.pnpm-store` for hardlink-friendliness, and on
  # this host that path already exists, owned by a uid from before the
  # single-tenant migration — `runner` can't write into it, so the fixture
  # install failed with EACCES even with the working pnpm version. `TMPDIR`
  # below points Node's tmpdir at the job's own same-device temp dir instead,
  # so no cross-device store redirection is ever attempted. Verified by
  # actually running the full job sequence (build, test:packages,
  # test:budgets, test:bundle, test:integrations) against the real shared
  # store on the host with both changes in place.
  package:
    runs-on: [self-hosted, linux, x64, vps]
    steps:
      - uses: actions/checkout@v7
      # The `runner` context isn't available in a job-level `env:` block
      # (only in a step's), so TMPDIR is set here, into $GITHUB_ENV, where it
      # then applies to every later step in the job — see the job comment
      # above for why it's needed. $RUNNER_TEMP is the plain shell form of
      # the same `runner.temp` value.
      - run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright-version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      # `--with-deps` shells out to `apt-get` via sudo, which this runner's
      # unprivileged user does not have. The self-hosted host already carries
      # Playwright's system libraries host-wide, so only the browser binary
      # itself needs fetching — no OS deps step is needed, cache hit or miss.
      - run: pnpm exec playwright install chromium
      # Builds every package once via the Turborepo cache; test:packages,
      # test:bundle and test:integrations below rebuild the same package set
      # and hit that cache instead of rebuilding from scratch.
      - run: pnpm build
      - run: pnpm test:packages
      - run: pnpm test:budgets
      - run: pnpm test:bundle
      - run: pnpm test:integrations

  # Every job in this workflow runs on Linux, deliberately. A macOS job
  # (`hls-native-webkit`) used to run the WebKit HLS suite here, because
  # native HLS needs Safari's media stack and Playwright's Linux WebKit has
  # neither native HLS nor the proprietary codecs. It was removed as a
  # maintainer decision to keep CI on one OS.
  #
  # What that costs, stated plainly so nobody rediscovers it as a surprise:
  # `e2e/hls.spec.ts`'s "plays the local hls fixture natively without
  # downloading hls.js" self-skips unless it is on WebKit *and* darwin
  # (`hls.spec.ts:46-49`), so no CI job runs it any more and nothing else
  # covers the native-HLS path on a real Safari media stack. The test is kept
  # rather than deleted: it still runs for anyone working on a Mac, and it
  # documents the gap. The `hls-paths` job that gated the macOS run went with
  # it, having nothing left to gate.

  storybook:
    runs-on: [self-hosted, linux, x64, vps]
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright-version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      # `--with-deps` shells out to `apt-get` via sudo, which this runner's
      # unprivileged user does not have. The self-hosted host already carries
      # Playwright's system libraries host-wide, so only the browser binary
      # itself needs fetching — no OS deps step is needed, cache hit or miss.
      - run: pnpm exec playwright install chromium
      - run: pnpm --filter @reely/storybook build
      - run: pnpm test:storybook
