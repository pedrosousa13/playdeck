name: Deploy site

# What `playdeck.video` publishes: `apps/site`, at the root of the domain and
# alone there. The documents a consumer is sent to are the site's own rendering
# of them, from the sources under `apps/storybook/stories/` — #533 moved them —
# so the claim #435 filed against, that the documentation is reachable only by
# cloning the monorepo, is answered by the site rather than by publishing the
# workbench. The workbench stays a local development tool and nothing here
# builds it (#534).
#
# Wrangler is driven from this file, against a `wrangler.jsonc` committed at the
# repository root, rather than through Cloudflare's dashboard Git integration.
# The integration would move the build command, the branch that publishes and
# the output directory into settings nobody can review or diff, so a change to
# how this repository is published would leave no trace in it. That file records
# what the deployment itself is; this one records when it runs.
#
# `main` only. Deploying a branch would overwrite the published documentation
# with unreviewed content; `ci.yml` already builds the site on every pull
# request, which is the part a pull request needs. What no pull-request gate
# does is assemble the artifact and serve it, so a failure that only appears
# once the build is served from an origin root appears here first.
# `workflow_dispatch` is here to re-publish without an empty commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only, as in `ci.yml` and `release.yml`, and this time the job below does
# not widen it: the deploy authenticates to Cloudflare with its own credentials
# and asks nothing of GitHub beyond the checkout.
permissions:
  contents: read

# `cancel-in-progress: false` deliberately, unlike `ci.yml`, and for the reason
# `release.yml` gives for the same setting: the tail of this job publishes, and
# a publish interrupted partway is worse than a publish that waited. Two merges
# landing together cost a queued run, which is the cheaper failure.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    # Only runs where the credentials and the domain exist. `release.yml` guards
    # its publishing jobs the same way and for the same reason: a fork
    # inheriting this file should not act on its own repository as a side effect
    # of being a fork.
    if: github.repository == 'pedrosousa13/playdeck'
    runs-on: ubuntu-latest
    # Install, the library builds the site measures, one static build, a
    # directory copy and an asset upload — no browsers, no packaging harness.
    # `ci.yml` records its `storybook` job at 37s whole-job, install included
    # (2026-08-20, run 32337178101); the seven library builds this one runs are
    # `vite build && tsc -b` apiece, the Astro build and the copy are small
    # beside them, and the upload is bounded by the same artifact. 15 minutes is
    # still several times the work, in the same spirit as the bounds there.
    # Revisit it if the site grows a build that is not.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The packages, before the site, because the landing page measures them.
      # It renders the gzipped size of every bundle `pnpm test:budgets` gates,
      # read at build time from the module that gate measures with rather than
      # from figures typed into the page, and that module reads build output. A
      # site built against an unbuilt tree fails here by name instead of
      # publishing a table of stale numbers.
      #
      # Topological, which is `pnpm run -r`'s own order, so a package is built
      # after the packages it depends on.
      - run: pnpm --filter './packages/*' build

      # The site is handed no base path, and that is not an omission. It is
      # served from the apex, so its prefix is the root its build already
      # defaults to and there is nothing to say (#519).
      - run: pnpm --filter @playdeck/site build
        env:
          # This public flag is deliberately set only in the workflow that
          # publishes playdeck.video. Local and pull-request builds omit the
          # Plausible script entirely.
          PUBLIC_PLAUSIBLE_ANALYTICS: 'true'

      # What the artifact holds is the script's to say, not this file's — the
      # verification harness assembles the same artifact, and one definition is
      # what keeps the two from drifting. The directory named here is the one
      # `wrangler.jsonc` publishes as its assets.
      - run: node scripts/assemble-deploy.mjs deploy-dist

      # Cloudflare's documented choice for the token is the "Edit Cloudflare
      # Workers" API token template (their documentation, read 2026-08-29). A
      # narrower set — Workers Scripts: Edit, Account Settings: Read, and
      # Workers Routes: Edit on the zone the custom domain belongs to — is
      # inferred from what this deploy touches rather than documented, so it is
      # offered as a starting point and not as a supported configuration.
      #
      # `command` is left at the action's default, `deploy`, which publishes the
      # version and puts it in front of traffic in one step. `versions upload`
      # would stage a version that no request reaches until a second
      # `versions deploy` promotes it, which is a staged-rollout workflow this
      # repository does not run.
      #
      # A run with either secret missing fails here rather than skipping, which
      # is the correct outcome: a publish that quietly did not happen looks
      # exactly like a publish that did.
      #
      # `wranglerVersion` is pinned because the action's own version tag does
      # not reach it: the action installs the CLI at run time, so without a
      # version here a new Wrangler could change how this repository publishes
      # with no diff to review. The tool that does the publishing is the last
      # thing that should float.
      #
      # It has to agree with the `wrangler` devDependency in the root
      # `package.json`, and that is what makes this step work at all. The action
      # probes for the CLI with `pnpm exec wrangler --version` and installs it
      # with a bare `pnpm add` when the probe fails -- which pnpm refuses in a
      # workspace root without `-w`, a flag the action does not pass
      # (`ERR_PNPM_ADDING_TO_ROOT`). Declaring the dependency makes the probe
      # succeed, so the install never runs. If the two versions drift, the probe
      # fails again and the deploy goes back to failing on that refusal.
      - uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.127.1'
