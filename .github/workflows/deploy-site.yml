name: Deploy site

# The Storybook workbench is the documentation — `README.md` says so — and
# without a published copy the only way to read it is to clone the monorepo and
# run a full workspace install, which somebody who ran `pnpm add @playdeck/react`
# has no reason and no instruction to do (#435). Publishing it makes that claim
# true for a consumer who has only ever seen npm.
#
# One deployment carries two surfaces: `apps/site` at the root of
# `playdeck.video`, the workbench at `/storybook/` (#519). They are built
# separately and assembled into one directory here, because neither build knows
# the other exists — each is handed the prefix it is served from and nothing
# else.
#
# Wrangler is driven from this file, against a `wrangler.jsonc` committed at the
# repository root, rather than through Cloudflare's dashboard Git integration.
# The integration would move the build command, the branch that publishes and
# the output directory into settings nobody can review or diff, so a change to
# how this repository is published would leave no trace in it. That file records
# what the deployment itself is; this one records when it runs.
#
# `main` only. Deploying a branch would overwrite the published documentation
# with unreviewed content; `ci.yml`'s `storybook` job already proves on every
# pull request that the workbench build still succeeds, which is the part a pull
# request needs. It does not build the site, so a site build that only breaks
# under a base path breaks here rather than on the pull request that introduced
# it; carrying the site into that gate is #528. `workflow_dispatch` is here to
# re-publish without an empty commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only, as in `ci.yml` and `release.yml`, and this time the job below does
# not widen it: the deploy authenticates to Cloudflare with its own credentials
# and asks nothing of GitHub beyond the checkout.
permissions:
  contents: read

# `cancel-in-progress: false` deliberately, unlike `ci.yml`, and for the reason
# `release.yml` gives for the same setting: the tail of this job publishes, and
# a publish interrupted partway is worse than a publish that waited. Two merges
# landing together cost a queued run, which is the cheaper failure.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    # Only runs where the credentials and the domain exist. `release.yml` guards
    # its publishing jobs the same way and for the same reason: a fork
    # inheriting this file should not act on its own repository as a side effect
    # of being a fork.
    if: github.repository == 'pedrosousa13/playdeck'
    runs-on: ubuntu-latest
    # Install plus two static builds, an assembly and an asset upload — no
    # browsers, no packaging harness. `ci.yml` records its `storybook` job at 37s
    # whole-job, install included (2026-08-20, run 32337178101); the Astro build
    # of a placeholder page and a directory copy are small beside it, and the
    # upload is bounded by the same artifact. 15 minutes is still several times
    # the work, in the same spirit as the bounds there. Revisit it if the site
    # grows a build that is not.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `PLAYDECK_BASE_PATH` is the one mechanism for telling a build what
      # prefix it is served from: `apps/storybook/.storybook/main.ts` reads it
      # into its bundler's `base`. The workbench is served one segment inside
      # the deployment, which is precisely the value below, and it has to be
      # passed here because where the workbench lands in the artifact is this
      # file's decision and the assemble script's, not the workbench's.
      #
      # The site is handed nothing, and that is not an omission. It is served
      # from the apex, so its prefix is the root its build already defaults to
      # and there is nothing to say (#519).
      - run: pnpm --filter @playdeck/site build

      - run: pnpm --filter @playdeck/storybook build
        env:
          PLAYDECK_BASE_PATH: /storybook/

      # Where each build output lands in the artifact is the script's to say,
      # not this file's — the verification harness assembles the same layout,
      # and one definition is what keeps the two from drifting. The directory
      # named here is the one `wrangler.jsonc` publishes as its assets.
      - run: node scripts/assemble-site.mjs site-dist

      # Cloudflare's documented choice for the token is the "Edit Cloudflare
      # Workers" API token template. A narrower set — Workers Scripts: Edit,
      # Account Settings: Read, and Workers Routes: Edit on the zone the custom
      # domain belongs to — is inferred from what this deploy touches rather
      # than documented, so it is offered as a starting point and not as a
      # supported configuration.
      #
      # `command` is left at the action's default, `deploy`, which publishes the
      # version and puts it in front of traffic in one step. `versions upload`
      # would stage a version that no request reaches until a second
      # `versions deploy` promotes it, which is a staged-rollout workflow this
      # repository does not run.
      #
      # A run with either secret missing fails here rather than skipping, which
      # is the correct outcome: a publish that quietly did not happen looks
      # exactly like a publish that did.
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
