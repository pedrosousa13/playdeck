name: Real providers

# The `@real` e2e tests load actual youtube-nocookie.com embeds and the real
# Vimeo SDK, so `playwright.config.ts` excludes them from every run unless
# REELY_REAL_PROVIDERS is set. That keeps a third-party outage from turning an
# unrelated PR red — but nothing set the variable either, so the tests only ran
# when someone remembered, which in practice was never. A provider changing its
# SDK would have reached a consumer before it reached CI (#91 is that shape:
# `buffered` unreported on YouTube and fabricated on Vimeo).
#
# So they run on a schedule instead of on a merge: still never blocking, but
# drift surfaces within a day and lands on an issue rather than in someone's
# terminal history.
on:
  schedule:
    # 05:17 UTC. Off the hour on purpose — scheduled runs cluster on the hour
    # and get queued behind everyone else's.
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: real-providers
  # Never cancel a run in progress: unlike PR CI there is no newer commit that
  # supersedes this one, and a cancelled run reports nothing.
  cancel-in-progress: false

jobs:
  real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright-version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # Chromium only. These tests check what the providers report, not how a
      # browser renders it, so a second and third engine would triple the load
      # on someone else's servers for the same answer. Engine-specific
      # behaviour is covered by the deterministic suite.
      #
      # pnpm appends extra CLI args to the end of a compound script rather than
      # inserting a `--` separator, so these land on the `playwright test` half.
      - run: pnpm test:e2e --project=chromium --grep @real --reporter=html --trace=retain-on-failure
        env:
          REELY_REAL_PROVIDERS: '1'
          # The HTML reporter tries to open a browser when a run fails.
          PLAYWRIGHT_HTML_OPEN: never
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      # Nobody is watching a scheduled run, so a failure has to come find us.
      # One open issue at a time: a provider that stays broken for a week
      # should be seven comments on one issue, not seven issues.
      - name: Report the failure on an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --state open --label real-providers --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again on $(date -u '+%Y-%m-%d'): $RUN_URL"
            exit 0
          fi
          cat > /tmp/real-providers-issue.md <<EOF
          The scheduled \`@real\` run failed: $RUN_URL

          These tests talk to third parties, so the first question is whether this
          is a genuine adapter regression or an outage, a rate limit, or a consent
          interstitial on their end. Re-run the job before investigating — the run
          page carries a Playwright HTML report and a trace for the retried attempt.

          Reproduce locally:

          \`\`\`sh
          REELY_REAL_PROVIDERS=1 pnpm test:e2e --project=chromium --grep @real
          \`\`\`

          Close this issue once the run is green again: the workflow comments on an
          open issue rather than filing a new one, so leaving a stale one open
          silences the next report.
          EOF
          gh issue create \
            --title "Real-provider run is failing against the live YouTube/Vimeo SDKs" \
            --label real-providers \
            --body-file /tmp/real-providers-issue.md
