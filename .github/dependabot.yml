# `tests/audit/fixture/` holds two pnpm workspaces whose dependencies are
# vulnerable on purpose. `scripts/audit.mjs` proves both of its directions
# against those exact versions: `cookie@0.4.0` is the low-severity advisory
# that must make the gate exit non-zero because a publishable package reaches
# it, and `minimist@0.0.8` and `shell-quote@1.7.2` are the criticals that must
# leave it exiting 0 because only a dev dependency and a private package do.
# Bumping any of them deletes the thing under test while the tests still pass.
#
# Dependabot found them on its own -- three security pull requests were opened
# and closed within a day of the fixture landing -- so this file exists to stop
# that recurring. The two fixture workspaces sit outside the root
# `pnpm-workspace.yaml` globs, which is why Dependabot sees them as their own
# ecosystems and why they need their own entries here: an `ignore` rule only
# applies to the directory whose entry carries it, so ignoring these package
# names at the root would have suppressed real updates elsewhere in the repo
# instead.
#
# The entries below cover the root workspace. Before they existed, the two
# fixture entries above were the only ones in this file, so the root -- and
# with it the shipped runtime dependencies, `hls.js` and `@vimeo/player` --
# got security pull requests only, never routine version updates.
# `directory: /` is enough for the whole pnpm workspace: Dependabot's npm
# ecosystem reads `pnpm-workspace.yaml` from there, so one entry covers every
# package under it.
#
# Minor and patch updates are grouped into a single weekly pull request per
# ecosystem. Majors are left out of the group so each one opens its own pull
# request: a major can carry a breaking change, so it needs its own review and
# its own decision to take or defer, not a spot inside a batch of routine
# bumps nobody reads that closely.
#
# A few dependencies don't version independently of their own family: one
# member pins a sibling to its own exact version, or peers against it at that
# exact version, so the family only installs together. Leaving majors
# ungrouped splits those apart -- one member bumped, the rest left behind --
# and the result installs but doesn't run. Those families get their own
# group, ordered before the general one so Dependabot claims them there
# first, with major updates included alongside minor and patch.
version: 2
updates:
  - package-ecosystem: npm
    directory: /tests/audit/fixture/shipped
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'

  - package-ecosystem: npm
    directory: /tests/audit/fixture/development-only
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
        update-types:
          - major
          - minor
          - patch
      playwright:
        patterns:
          - 'playwright'
          - '@playwright/*'
        update-types:
          - major
          - minor
          - patch
      storybook:
        patterns:
          - 'storybook'
          - '@storybook/*'
        update-types:
          - major
          - minor
          - patch
      react:
        patterns:
          - 'react'
          - 'react-dom'
        update-types:
          - major
          - minor
          - patch
      tailwindcss:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
        update-types:
          - major
          - minor
          - patch
      videojs:
        patterns:
          - '@videojs/*'
        update-types:
          - major
          - minor
          - patch
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
